<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BFHL Node Hierarchy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <style>
    body { background: #111314; color: #e5e7eb; }
    .container { max-width: 860px; }
    h3 { color: #fff; }
    p.text-muted { color: #9ca3af !important; }

    /* comet card */
    .comet-card {
      position: relative;
      border-radius: 16px;
      padding: 2px;
      background: #1f2121;
      overflow: hidden;
    }
    .comet-card::before {
      content: '';
      position: absolute;
      inset: -60%;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        transparent 70%,
        #a78bfa 80%,
        #60a5fa 88%,
        #fff 92%,
        transparent 94%,
        transparent 100%
      );
      animation: comet-spin 3s linear infinite;
      border-radius: 50%;
    }
    @keyframes comet-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .comet-inner {
      position: relative;
      z-index: 1;
      background: #1f2121;
      border-radius: 14px;
      padding: 1.5rem;
    }

    /* override bootstrap card for dark */
    .card {
      background: #1f2121;
      border: 1px solid #2d2f2f;
      color: #e5e7eb;
    }
    .card-header { border-bottom: 1px solid #2d2f2f; background: #191b1b; color: #e5e7eb; }
    .form-control, .form-control:focus {
      background: #111314;
      border-color: #374151;
      color: #e5e7eb;
    }
    .form-control::placeholder { color: #6b7280; }
    .form-label { color: #d1d5db; }
    .text-muted { color: #9ca3af !important; }
    code { color: #a78bfa; }

    .tree-ul { list-style: none; padding-left: 20px; border-left: 2px solid #374151; margin-top: 4px; }
    .tree-ul li { position: relative; padding: 2px 0 2px 14px; }
    .tree-ul li::before {
      content: '';
      position: absolute;
      left: 0; top: 12px;
      width: 12px; height: 1px;
      background: #4b5563;
    }
    .node-badge { font-family: monospace; font-size: 0.95rem; }
  </style>
</head>
<body>
<div class="container py-4">
  <h3 class="mb-1">Bajaj Full Stack Task-Abhishek Kinjawadekar</h3>
  <p class="text-muted mb-4">Enter edges one per line (e.g. <code>A->B</code>) and hit Submit.</p>

  <div class="comet-card mb-4">
    <div class="comet-inner">
      <div class="mb-3">
        <label class="form-label fw-semibold">Node Edges</label>
        <textarea id="inputData" class="form-control font-monospace" rows="7"
          placeholder="A->B&#10;A->C&#10;B->D&#10;X->Y&#10;Y->Z&#10;Z->X"></textarea>
      </div>
      <button id="submitBtn" class="btn btn-primary px-4">Submit</button>
    </div>
  </div>

  <div id="errorBox" class="alert alert-danger d-none"></div>
  <div id="results" class="d-none">

    <!-- Identity -->
    <h5 class="mb-3">Identity</h5>
    <div class="row mb-4 g-3" id="userInfo"></div>

    <!-- Summary -->
    <div class="row mb-4 g-3" id="summaryCards"></div>

    <!-- Hierarchies -->
    <h5 class="mb-3">Hierarchies</h5>
    <div id="hierarchyCards" class="row g-3 mb-4"></div>

    <!-- Invalid + Duplicates -->
    <div class="row g-3">
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-warning bg-opacity-25">Invalid Entries</div>
          <div class="card-body" id="invalidList"><span class="text-muted">None</span></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-secondary bg-opacity-10">Duplicate Edges</div>
          <div class="card-body" id="dupList"><span class="text-muted">None</span></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // ── Processing logic (runs entirely in the browser) ──────────────────────────

  const USER_ID = 'abhishekkinjawadekar_10052005';
  const EMAIL_ID = 'ak1099@srmist.edu.in';
  const ROLL_NUMBER = 'RA2311042010007';

  function validateEntry(raw) {
    const s = String(raw).trim();
    if (!/^[A-Z]->[A-Z]$/.test(s)) return null;
    if (s[0] === s[3]) return null;
    return s;
  }

  function processData(data) {
    const invalid_entries = [];
    const seen = new Set(), dupSet = new Set();
    const duplicate_edges = [], validEdges = [];

    for (const raw of data) {
      const entry = validateEntry(raw);
      if (!entry) { invalid_entries.push(String(raw).trim()); continue; }
      if (seen.has(entry)) {
        if (!dupSet.has(entry)) { dupSet.add(entry); duplicate_edges.push(entry); }
        continue;
      }
      seen.add(entry);
      validEdges.push(entry);
    }

    const childParent = {}, keptEdges = [];
    for (const edge of validEdges) {
      const p = edge[0], c = edge[3];
      if (!childParent[c]) { childParent[c] = p; keptEdges.push(edge); }
    }

    const adj = {}, allNodes = new Set();
    for (const edge of keptEdges) {
      const p = edge[0], c = edge[3];
      allNodes.add(p); allNodes.add(c);
      if (!adj[p]) adj[p] = [];
      adj[p].push(c);
    }

    if (!allNodes.size) {
      return {
        user_id: USER_ID, email_id: EMAIL_ID, college_roll_number: ROLL_NUMBER,
        hierarchies: [], invalid_entries, duplicate_edges,
        summary: { total_trees: 0, total_cycles: 0, largest_tree_root: '' }
      };
    }

    const visited = new Set(), components = [];
    for (const start of allNodes) {
      if (visited.has(start)) continue;
      const comp = new Set(), q = [start];
      while (q.length) {
        const n = q.shift();
        if (visited.has(n)) continue;
        visited.add(n); comp.add(n);
        (adj[n] || []).forEach(ch => { if (!visited.has(ch)) q.push(ch); });
        if (childParent[n] && !visited.has(childParent[n])) q.push(childParent[n]);
      }
      components.push(comp);
    }

    const hierarchies = [];

    for (const comp of components) {
      const roots = [...comp].filter(n => !childParent[n]).sort();
      const root = roots.length ? roots[0] : [...comp].sort()[0];

      const dv = new Set(), ds = new Set(); let cycleFound = false;
      function dfs(n) {
        dv.add(n); ds.add(n);
        for (const ch of (adj[n] || [])) {
          if (!dv.has(ch)) { if (dfs(ch)) return true; }
          else if (ds.has(ch)) return true;
        }
        ds.delete(n); return false;
      }
      for (const n of comp) { if (!dv.has(n) && dfs(n)) { cycleFound = true; break; } }

      if (cycleFound) { hierarchies.push({ root, tree: {}, has_cycle: true }); continue; }

      function buildTree(n) {
        const o = {};
        for (const ch of (adj[n] || [])) o[ch] = buildTree(ch);
        return o;
      }
      function getDepth(n) {
        const k = adj[n] || [];
        return k.length ? 1 + Math.max(...k.map(getDepth)) : 1;
      }
      hierarchies.push({ root, tree: { [root]: buildTree(root) }, depth: getDepth(root) });
    }

    const trees = hierarchies.filter(h => !h.has_cycle);
    const cycles = hierarchies.filter(h => h.has_cycle);
    let largest_tree_root = '';
    if (trees.length) {
      const best = [...trees].sort((a, b) =>
        b.depth !== a.depth ? b.depth - a.depth : a.root < b.root ? -1 : 1
      );
      largest_tree_root = best[0].root;
    }

    return {
      user_id: USER_ID, email_id: EMAIL_ID, college_roll_number: ROLL_NUMBER,
      hierarchies, invalid_entries, duplicate_edges,
      summary: { total_trees: trees.length, total_cycles: cycles.length, largest_tree_root }
    };
  }

  // ── UI ───────────────────────────────────────────────────────────────────────

  document.getElementById('submitBtn').addEventListener('click', () => {
    const raw = document.getElementById('inputData').value.trim();
    const errorBox = document.getElementById('errorBox');
    const results = document.getElementById('results');
    errorBox.classList.add('d-none');
    results.classList.add('d-none');

    if (!raw) {
      errorBox.textContent = 'Please enter at least one edge.';
      errorBox.classList.remove('d-none');
      return;
    }

    const data = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
    const json = processData(data);
    renderResults(json);
  });

  function renderResults(data) {
    // User identity row
    document.getElementById('userInfo').innerHTML = `
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body py-2">
            <small class="text-muted">User ID</small>
            <div class="fw-semibold font-monospace">${data.user_id}</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body py-2">
            <small class="text-muted">Email</small>
            <div class="fw-semibold font-monospace">${data.email_id}</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body py-2">
            <small class="text-muted">Roll Number</small>
            <div class="fw-semibold font-monospace">${data.college_roll_number}</div>
          </div>
        </div>
      </div>
    `;

    const s = data.summary;
    document.getElementById('summaryCards').innerHTML = `
      <div class="col-sm-4">
        <div class="card text-center shadow-sm border-primary">
          <div class="card-body">
            <h2 class="card-title text-primary">${s.total_trees}</h2>
            <p class="card-text text-muted mb-0">Valid Trees</p>
          </div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card text-center shadow-sm border-danger">
          <div class="card-body">
            <h2 class="card-title text-danger">${s.total_cycles}</h2>
            <p class="card-text text-muted mb-0">Cyclic Groups</p>
          </div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card text-center shadow-sm border-success">
          <div class="card-body">
            <h2 class="card-title text-success">${s.largest_tree_root || '—'}</h2>
            <p class="card-text text-muted mb-0">Largest Tree Root</p>
          </div>
        </div>
      </div>
    `;

    const hContainer = document.getElementById('hierarchyCards');
    hContainer.innerHTML = '';
    for (const h of data.hierarchies) {
      const col = document.createElement('div');
      col.className = 'col-md-6';

      const isCycle = !!h.has_cycle;
      const headerClass = isCycle ? 'bg-danger text-white' : 'bg-primary text-white';
      const badge = isCycle
        ? '<span class="badge bg-light text-danger ms-2">CYCLE</span>'
        : `<span class="badge bg-light text-primary ms-2">depth: ${h.depth}</span>`;

      col.innerHTML = `
        <div class="card shadow-sm h-100">
          <div class="card-header ${headerClass} d-flex align-items-center">
            Root: <strong class="ms-1">${h.root}</strong>${badge}
          </div>
          <div class="card-body">
            ${isCycle
              ? '<p class="text-muted mb-0">This group contains a cycle — no tree structure available.</p>'
              : buildTreeHtml(h.tree)
            }
          </div>
        </div>
      `;
      hContainer.appendChild(col);
    }

    const invEl = document.getElementById('invalidList');
    invEl.innerHTML = data.invalid_entries.length
      ? data.invalid_entries.map(e => `<span class="badge bg-warning text-dark me-1 mb-1">${e}</span>`).join('')
      : '<span class="text-muted">None</span>';

    const dupEl = document.getElementById('dupList');
    dupEl.innerHTML = data.duplicate_edges.length
      ? data.duplicate_edges.map(e => `<span class="badge bg-secondary me-1 mb-1">${e}</span>`).join('')
      : '<span class="text-muted">None</span>';

    document.getElementById('results').classList.remove('d-none');
  }

  function buildTreeHtml(treeObj) {
    function renderNode(name, children) {
      const keys = Object.keys(children);
      let html = `<li><span class="badge bg-primary node-badge">${name}</span>`;
      if (keys.length) {
        html += '<ul class="tree-ul">';
        for (const k of keys) html += renderNode(k, children[k]);
        html += '</ul>';
      }
      html += '</li>';
      return html;
    }

    const topKeys = Object.keys(treeObj);
    if (!topKeys.length) return '<span class="text-muted">Empty</span>';
    let html = '<ul class="tree-ul ps-0" style="border-left:none">';
    for (const k of topKeys) html += renderNode(k, treeObj[k]);
    html += '</ul>';
    return html;
  }
</script>
</body>
</html>
